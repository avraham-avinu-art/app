plugins {
    id 'com.android.application'
}

android {
    namespace 'com.avrahamart.nightscreen'
    compileSdk 36

    defaultConfig {
        applicationId 'com.avrahamart.nightscreen'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
