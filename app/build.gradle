plugins {
    id 'com.android.application'
}

android {
    namespace 'com.avrahamart.nightscreen'
    compileSdk 36

    defaultConfig {
        applicationId 'com.avrahamart.nightscreen'
        minSdk 26
        targetSdk 36
        versionCode 14
        versionName '2.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.kosherjava:zmanim:2.5.0'
}
